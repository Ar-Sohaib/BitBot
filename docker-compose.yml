version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitbot-postgres
    environment:
      POSTGRES_PASSWORD: paperbot_secure_pass_123
      POSTGRES_DB: bitbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitbot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
